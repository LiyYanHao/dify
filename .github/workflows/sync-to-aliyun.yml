name: Sync to Aliyun Codeup

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Aliyun Codeup
        run: |
          git remote add aliyun https://oauth2:${{ secrets.ALIYUN_TOKEN }}@codeup.aliyun.com/6465db85b60a10415c31fed8/xswc/ai/dify.git
          git remote -v
          git branch -a
          git push aliyun main --force
        env:
          ALIYUN_TOKEN: ${{ secrets.ALIYUN_TOKEN }}
